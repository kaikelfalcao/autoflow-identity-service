services:
  identity-service:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/identity
      JWT_SECRET: local-dev-secret-minimo-32-caracteres-aqui-ok
      JWT_CUSTOMER_EXPIRES_IN: "1h"
      JWT_ADMIN_EXPIRES_IN: "8h"
      ORDER_SERVICE_URL: http://host.docker.internal:3001
      ORDER_SERVICE_TIMEOUT_MS: 2000
      SEED_ADMIN_EMAIL: admin@autoflow.com
      SEED_ADMIN_PASSWORD: Admin@123
      SEED_ADMIN_NAME: Administrador
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - identity_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  identity_pg_data:
