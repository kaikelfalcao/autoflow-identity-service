# TEMPLATE — valores reais são criados pela pipeline via:
#   kubectl create secret generic identity-secrets \
#     --from-literal=DATABASE_URL=... \
#     --from-literal=JWT_SECRET=... \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# DATABASE_URL é montado a partir do tfstate do stack 02-database-rds:
#   postgresql://identity_user:<service_password>@<rds-endpoint>:5432/identity
apiVersion: v1
kind: Secret
metadata:
  name: identity-secrets
  namespace: autoflow
type: Opaque
stringData:
  NODE_ENV: production
  PORT: "3000"
  LOG_LEVEL: info
  DATABASE_URL: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME_MIN_32_CHARS"
  JWT_CUSTOMER_EXPIRES_IN: "1h"
  JWT_ADMIN_EXPIRES_IN: "8h"
  ORDER_SERVICE_URL: "http://order-service.autoflow.svc.cluster.local:3001"
  ORDER_SERVICE_TIMEOUT_MS: "2000"
  CORRELATION_ID_HEADER: x-correlation-id
  SEED_ADMIN_EMAIL: "admin@autoflow.com"
  SEED_ADMIN_PASSWORD: "REPLACE_ME"
  SEED_ADMIN_NAME: "Administrador"
