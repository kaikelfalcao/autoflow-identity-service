name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'

jobs:
  test:
    name: Lint + Test + Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: identity_user
          POSTGRES_PASSWORD: identity_pass
          POSTGRES_DB: identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://identity_user:identity_pass@localhost:5432/identity
      JWT_SECRET: ci-test-secret-minimo-32-caracteres-aqui-ok
      JWT_CUSTOMER_EXPIRES_IN: 1h
      JWT_ADMIN_EXPIRES_IN: 8h
      ORDER_SERVICE_URL: http://localhost:3001
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run format:check --if-present
      - run: npm run test:cov
      - run: npm run test:bdd --if-present

      - name: SonarCloud Scan
        # Roda apenas quando SONAR_TOKEN está disponível (secret configurado).
        # Setup: ver autoflow-infra/docs/04-sonarcloud-setup.md
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
