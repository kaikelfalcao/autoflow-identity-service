name: Build

on:
  push:
    branches:
      - main

  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  security-events: write

env:
  NODE_VERSION: '24'

jobs:
  CI:
    name: CI pipeline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: identity_user
          POSTGRES_PASSWORD: identity_pass
          POSTGRES_DB: identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://identity_user:identity_pass@localhost:5432/identity
      JWT_SECRET: ci-test-secret-minimo-32-caracteres-aqui-ok
      JWT_CUSTOMER_EXPIRES_IN: 1h
      JWT_ADMIN_EXPIRES_IN: 8h
      ORDER_SERVICE_URL: http://localhost:3001
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Format check
        run: npm run format:check --if-present

      - name: Unit tests
        run: npm run test:cov

      - name: BDD tests
        run: npm run test:bdd --if-present

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
